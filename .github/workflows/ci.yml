name: CI
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnostic:
    name: WebKit retained-close diagnostics
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27
      options: --init --ipc=host
    defaults:
      run:
        shell: bash
    env:
      CI: "true"
      HOME: /root
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Trust container workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: ./.github/actions/setup
        with:
          browsers: "true"
          browser-engine: webkit
      - name: Repeat only the affected journey with renderer evidence
        run: |
          set -eu
          mkdir -p test-results/diagnostics
          git rev-parse HEAD > test-results/diagnostics/revision
          (
            while :; do
              date -u
              cat /proc/loadavg
              grep -E "MemAvailable|MemFree|SwapFree" /proc/meminfo || true
              for entry in memory.current memory.max memory.events; do
                if test -r "/sys/fs/cgroup/$entry"; then
                  echo "$entry"
                  cat "/sys/fs/cgroup/$entry"
                fi
              done
              ps -eo pid,ppid,rss,pcpu,comm
              sleep 2
            done
          ) > test-results/diagnostics/resources.log 2>&1 &
          monitor=$!
          trap 'kill "$monitor" 2>/dev/null || true' EXIT
          set +e
          DEBUG=pw:browser ./bin/pnpm test:browser:ci --project webkit --no-deps --repeat-each=10 --grep "member rows hand off" tests/browser/profiles.spec.mjs > test-results/diagnostics/browser.log 2>&1
          result=$?
          set -e
          cat test-results/diagnostics/browser.log
          exit "$result"
      - name: Preserve diagnostic evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr2113-webkit-diagnostics
          path: |
            test-results/browser
            test-results/diagnostics
          retention-days: 7
